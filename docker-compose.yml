services:
  db:
    image: postgres:16
    container_name: db-radar-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data

volumes:
  dados-postgres:
